name: Test and Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  IMAGE_URI: "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}"

jobs:
  test:
    name: Run pytest suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci
          DJANGO_DEBUG: "True"
        run: python -m pytest

  deploy:
    name: Build and deploy container
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build container image
        run: docker build --tag "${{ env.IMAGE_URI }}" .

      - name: Push container image
        run: docker push "${{ env.IMAGE_URI }}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          image: ${{ env.IMAGE_URI }}
          env_vars: |-
            DJANGO_DEBUG=False
            DJANGO_ALLOWED_HOSTS=${{ vars.DJANGO_ALLOWED_HOSTS }}
            DJANGO_CSRF_TRUSTED_ORIGINS=${{ vars.DJANGO_CSRF_TRUSTED_ORIGINS }}
            DJANGO_SECURE_SSL_REDIRECT=True
            SQLITE_DB_PATH=/tmp/db.sqlite3
          secrets: |-
            DJANGO_SECRET_KEY=${{ vars.DJANGO_SECRET_KEY_SECRET_NAME }}:latest
          flags: "--port=8080 --max-instances=1 --allow-unauthenticated --service-account=${{ vars.GCP_SERVICE_ACCOUNT }}"

      - name: Show service URL
        run: |
          echo "Cloud Run URL: ${{ steps.deploy.outputs.url }}"
